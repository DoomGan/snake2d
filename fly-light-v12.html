<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>Fly Light V12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,Microsoft YaHei,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.n{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:2;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}.b{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;color:#fff;background:rgba(0,0,0,.34);padding:7px 10px;border-radius:999px;font:700 12px Arial;pointer-events:none}</style></head><body><div class='n'>V12：统一角色与柱子阴影</div><canvas id='g'></canvas><div class='b'>统一正交投影</div><script>(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),im=new Image();let ok=false;im.onload=()=>ok=true;fetch('./assets/player.b64.txt').then(r=>r.text()).then(t=>im.src='data:image/jpeg;base64,'+t.trim()).catch(()=>{});let W,H,D=1,gd=0,gy=0,b,p=[],sc=0,best=+localStorage.v12best||0,play=false,dead=false,f=0,pt=[],ac=null;const L={x:.82,y:.57},cl=(v,a,z)=>Math.max(a,Math.min(z,v));function R(){D=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*D;H=c.height=innerHeight*D;gd=Math.max(58*D,H*.095);gy=H-gd+6*D;if(!b)reset(false);pt=Array.from({length:Math.min(32,Math.max(20,W*H/72000|0))},()=>({x:Math.random()*W,y:Math.random()*H,r:(.5+Math.random()*1.8)*D,v:(.1+Math.random()*.25)*D,a:.14+Math.random()*.3}))}function reset(s){b={x:W*.28,y:H*.45,vy:0,r:Math.max(29*D,W*.073)};p=[];sc=0;f=0;dead=false;play=!!s;if(s)addP()}function addP(){let gap=Math.max(196*D,H*.31),w=Math.max(62*D,W*.16),top=62*D+Math.random()*Math.max(1,H-gd-gap-158*D);p.push({x:W+45*D,w,top,gap,done:false})}function aud(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext);if(ac.state==='suspended')ac.resume()}catch(e){}}function snd(q=650,d=.07,t='triangle',v=.055){if(!ac)return;let T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(q,T);o.frequency.exponentialRampToValueAtTime(q*1.18,T+d);g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.03)}function tap(e){e&&e.preventDefault();aud();if(!play||dead){reset(true);snd(520,.1,'sine',.045);return}b.vy=-Math.max(8*D,H*.0125);snd(690,.06,'triangle',.06)}c.addEventListener('pointerdown',tap,{passive:false});c.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});function hit(o){let r=b.r*.62;return b.x+r>o.x&&b.x-r<o.x+o.w&&(b.y-r<o.top||b.y+r>o.top+o.gap)}function over(){if(dead)return;dead=true;play=false;best=Math.max(best,sc);localStorage.v12best=best;snd(165,.16,'sawtooth',.04)}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#52bfff');g.addColorStop(.52,'#dffaff');g.addColorStop(1,'#fff1c8');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.globalCompositeOperation='screen';let s=x.createRadialGradient(W*.045,H*.045,0,W*.045,H*.045,W*.42);s.addColorStop(0,'rgba(255,251,195,.95)');s.addColorStop(.3,'rgba(255,226,125,.34)');s.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=s;x.fillRect(0,0,W,H);ray(-.14,.08,.82,.16,.16);ray(-.22,.30,.88,.10,.09);ray(-.28,.48,.92,.07,.06);x.restore()}function ray(px,py,len,th,a){x.save();x.translate(W*px,H*py);x.rotate(Math.PI*.2);let g=x.createLinearGradient(0,0,W*len,0);g.addColorStop(0,'rgba(255,255,224,'+a+')');g.addColorStop(.56,'rgba(255,244,190,'+a*.34+')');g.addColorStop(1,'rgba(255,244,190,0)');x.fillStyle=g;x.fillRect(0,-H*th/2,W*len,H*th);x.restore()}function N(vx,vy){let n=Ma L.y),len=cl(42*D+h*.1,34*D,86*D),l=proj(o.x+o.w*.16,y),r=proj(o.x+o.w*.94,y),q1={x:l.x+v.x*len,y:gy+v.y*len*.1},q2={x:r.x+v.x*len,y:gy+v.y*len*.1},g=x.createLinearGradient(l.x,gy,q1.x,q1.y);g.addColorStop(0,'rgba(0,18,28,'+(.10*(1-u)+.045)+')');g.addColorStop(1,'rgba(0,18,28,0)');Q({x:l.x,y:gy-2*D},{x:r.x,y:gy-2*D},q2,q1,g)}function shadows(){p.forEach(shadowPipe);shadowPlayer()}function pipe(o){part(o.x,0,o.w,o.top,1);part(o.x,o.top+o.gap,o.w,H-gd-(o.top+o.gap),0)}function part(px,py,w,h,top){if(h<=0)return;let g=x.createLinearGradient(px,py,px+w,py);g.addColorStop(0,'#2eb84d');g.addColorStop(.2,'#8af47f');g.addColorStop(.62,'#279c43');g.addColorStop(1,'#125d29');x.fillStyle=g;x.fillRect(px,py,w,h);x.fillStyle='rgba(255,255,235,.26)';x.fillRect(px+5*D,py,6*D,h);x.fillStyle='rgba(0,0,0,.20)';x.fillRect(px+w-9*D,py,9*D,h);x.fillStyle='#1e8538';top?x.fillRect(px-5*D,py+h-20*D,w+10*D,20*D):x.fillRect(px-5*D,py,w+10*D,20*D)}function player(){x.save();x.translate(b.x,b.y);x.rotate(cl(b.vy/(16*D),-.32,.40));let s=b.r*2.08;x.shadowColor='rgba(0,0,0,.20)';x.shadowBlur=5*D;x.shadowOffsetX=2*D;x.shadowOffsetY=3*D;if(ok){x.beginPath();x.arc(0,0,s*.47,0,Math.PI*2);x.clip();x.drawImage(im,-s/2,-s/2,s,s);x.globalCompositeOperation='screen';let hi=x.createLinearGradient(-s/2,-s/2,s/2,s/2);hi.addColorStop(0,'rgba(255,248,182,.56)');hi.addColorStop(.34,'rgba(255,248,182,.10)');hi.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=hi;x.fillRect(-s/2,-s/2,s,s);x.globalCompositeOperation='source-over';let sh=x.createLinearGradient(-s/2,-s/2,s/2,s/2);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.72,'rgba(10,20,40,.08)');sh.addColorStop(1,'rgba(10,20,40,.24)');x.fillStyle=sh;x.fillRect(-s/2,-s/2,s,s)}else{x.fillStyle='#ffd640';x.beginPath();x.arc(0,0,b.r,0,Math.PI*2);x.fill()}x.restore()}function dust(){x.save();x.globalCompositeOperation='screen';for(let o of pt){o.y-=o.v;o.x+=o.v*.22;if(o.y<-8*D){o.y=H+8*D;o.x=Math.random()*W}x.globalAlpha=o.a;x.fillStyle='rgba(255,252,220,.72)';x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()}x.globalAlpha=1;x.restore()}function vig(){let g=x.createRadialGradient(W*.45,H*.38,Math.min(W,H)*.22,W*.45,H*.38,Math.max(W,H)*.73);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.76,'rgba(0,12,30,.06)');g.addColorStop(1,'rgba(0,0,0,.32)');x.fillStyle=g;x.fillRect(0,0,W,H)}function txt(t,z,y){x.textAlign='center';x.font='800 '+z*D+'px Arial';x.lineWidth=5*D;x.strokeStyle='rgba(0,0,0,.55)';x.fillStyle='#fff';x.strokeText(t,W/2,y);x.fillText(t,W/2,y)}function upd(){if(!play||dead)return;f++;b.vy+=Math.max(.38*D,H*.00062);b.y+=b.vy;if(f%96===0)addP();p.forEach(o=>o.x-=Math.max(2.6*D,W*.0068));p=p.filter(o=>o.x+o.w>-35*D);for(let o of p){if(!o.done&&o.x+o.w<b.x){o.done=true;sc++;snd(880,.055,'sine',.046)}if(hit(o))over()}if(b.y-b.r<0||b.y+b.r>H-gd)over()}function loop(){requestAnimationFrame(loop);upd();bg();lightOcc();ground();shadows();p.forEach(pipe);player();dust();vig();txt(String(sc),42,62*D);x.font='700 '+16*D+'px Arial';x.lineWidth=4*D;x.strokeStyle='rgba(0,0,0,.45)';x.fillStyle='#fff';x.textAlign='center';x.strokeText('最高分：'+best,W/2,92*D);x.fillText('最高分：'+best,W/2,92*D);if(!play&&!dead){txt('Fly Light V12',31,H*.38);txt('点任意位置开始',20,H*.45)}if(dead){x.fillStyle='rgba(0,0,0,.36)';x.fillRect(W*.12,H*.34,W*.76,145*D);txt('游戏结束',30,H*.40);txt('点任意位置重开',19,H*.47)}}addEventListener('resize',R);addEventListener('orientationchange',()=>setTimeout(R,250));R();reset(false);loop()})();</script></body></html>
