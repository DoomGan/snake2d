<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>Fly Shadow Light V8</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,'Microsoft YaHei',sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none;background:#061421}.note{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:2;text-align:center;color:white;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.75);pointer-events:none}.badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;color:white;background:rgba(0,0,0,.34);padding:7px 10px;border-radius:999px;font:700 12px Arial,'Microsoft YaHei',sans-serif;pointer-events:none;text-shadow:0 1px 3px #000}</style></head><body><div class='note'>V8 阴影 + 光线遮挡版</div><canvas id='game'></canvas><div class='badge'>体积光 / 遮挡 / 投影 / 音效</div><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),img=new Image();let imageReady=false;img.onload=()=>imageReady=true;fetch('./assets/player.b64.txt').then(r=>r.text()).then(t=>{img.src='data:image/jpeg;base64,'+t.trim()}).catch(()=>{});let W=0,H=0,dpr=1,ground=0,bird,pipes=[],score=0,best=Number(localStorage.getItem('flyShadowLightV8Best')||0),playing=false,dead=false,frame=0,particles=[],audioCtx=null;function ensureAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function beep(f=650,d=.075,type='triangle',v=.075){if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.25,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d+.03)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.width=Math.floor(innerWidth*dpr);H=canvas.height=Math.floor(innerHeight*dpr);ground=Math.max(58*dpr,H*.095);if(!bird)reset(false);makeParticles()}function makeParticles(){particles=[];const n=Math.round(Math.min(55,Math.max(28,W*H/42000)));for(let i=0;i<n;i++)particles.push({x:Math.random()*W,y:Math.random()*H,s:(.6+Math.random()*2.4)*dpr,v:(.15+Math.random()*.42)*dpr,a:.18+Math.random()*.5})}function reset(start){bird={x:W*.28,y:H*.45,vy:0,r:Math.max(28*dpr,W*.075)};pipes=[];score=0;frame=0;dead=false;playing=!!start;if(start)addPipe()}function addPipe(){const gap=Math.max(190*dpr,H*.30),w=Math.max(62*dpr,W*.165),top=58*dpr+Math.random()*Math.max(1,H-ground-gap-150*dpr);pipes.push({x:W+44*dpr,w,top,gap,done:false})}function tap(e){if(e)e.preventDefault();ensureAudio();if(!playing||dead){reset(true);beep(520,.11,'sine',.06);return}bird.vy=-Math.max(8*dpr,H*.0125);beep(660,.07,'triangle',.075)}canvas.addEventListener('touchstart',tap,{passive:false});canvas.addEventListener('pointerdown',tap,{passive:false});document.body.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});function hit(p){const r=bird.r*.62;return bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)}function over(){if(dead)return;dead=true;playing=false;best=Math.max(best,score);localStorage.setItem('flyShadowLightV8Best',best);beep(165,.18,'sawtooth',.05)}function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#58bfff');g.addColorStop(.52,'#d9fbff');g.addColorStop(1,'#fff0c5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='screen';let rg=ctx.createRadialGradient(W*.03,H*.03,0,W*.03,H*.03,W*.42);rg.addColorStop(0,'rgba(255,250,190,.95)');rg.addColorStop(.32,'rgba(255,222,120,.45)');rg.addColorStop(.72,'rgba(255,230,150,.05)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);drawRay(-.10,.07,.46,.25,.20);drawRay(-.18,.28,.58,.17,.14);drawRay(-.22,.47,.70,.11,.10);ctx.restore()}function drawRay(x0,y0,len,thick,alpha){ctx.save();ctx.translate(W*x0,H*y0);ctx.rotate(Math.PI*.19);const grad=ctx.createLinearGradient(0,0,W*len,0);grad.addColorStop(0,'rgba(255,255,220,'+alpha+')');grad.addColorStop(.55,'rgba(255,244,190,'+(alpha*.42)+')');grad.addColorStop(1,'rgba(255,244,190,0)');ctx.fillStyle=grad;ctx.filter='blur('+Math.max(7*dpr,10)+'px)';ctx.fillRect(0,-H*thick/2,W*len,H*thick);ctx.restore();ctx.filter='none'}function occludeRect(x,y,w,h,alpha=.22){const dx=130*dpr,dy=96*dpr;ctx.save();ctx.filter='blur('+7*dpr+'px)';ctx.fillStyle='rgba(14,29,45,'+alpha+')';ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+dx,y+dy);ctx.lineTo(x+w+dx,y+h+dy);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();ctx.restore();ctx.filter='none'}function drawPipeShadow(p){occludeRect(p.x,0,p.w,p.top,.18);occludeRect(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),.24);ctx.save();ctx.fillStyle='rgba(0,18,30,.18)';ctx.transform(1,0,.72,1,90*dpr,72*dpr);ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap));ctx.restore()}function pipe(p){drawPipePart(p.x,0,p.w,p.top,true);drawPipePart(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),false)}function drawPipePart(x,y,w,h,top){const grad=ctx.createLinearGradient(x,y,x+w,y);grad.addColorStop(0,'#39c85c');grad.addColorStop(.22,'#7df57b');grad.addColorStop(.64,'#239c42');grad.addColorStop(1,'#136b2d');ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,220,.30)';ctx.fillRect(x+5*dpr,y,7*dpr,h);ctx.fillStyle='rgba(0,0,0,.20)';ctx.fillRect(x+w-10*dpr,y,10*dpr,h);ctx.fillStyle='#1f8438';if(top)ctx.fillRect(x-5*dpr,y+h-20*dpr,w+10*dpr,20*dpr);else ctx.fillRect(x-5*dpr,y,w+10*dpr,20*dpr);ctx.fillStyle='rgba(255,255,255,.18)';if(top)ctx.fillRect(x-2*dpr,y+h-20*dpr,w+4*dpr,4*dpr);else ctx.fillRect(x-2*dpr,y,w+4*dpr,4*dpr)}function groundDraw(){ctx.fillStyle='rgba(0,0,0,.20)';ctx.fillRect(0,H-ground-10*dpr,W,12*dpr);ctx.fillStyle='#64b246';ctx.fillRect(0,H-ground,W,12*dpr);let g=ctx.createLinearGradient(0,H-ground,0,H);g.addColorStop(0,'#d7a648');g.addColorStop(1,'#9e6924');ctx.fillStyle=g;ctx.fillRect(0,H-ground+12*dpr,W,ground);ctx.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<14;i++)ctx.fillRect((i*97*dpr+frame*.7*dpr)%(W+110*dpr)-80*dpr,H-ground+28*dpr,50*dpr,2*dpr)}function playerShadow(){const dist=Math.max(0,H-ground-bird.y),k=Math.max(.18,Math.min(1,1-dist/(H*.62))),sw=bird.r*(1.5+k*1.5),sh=bird.r*(.25+k*.22);ctx.save();ctx.translate(bird.x+dist*.10,H-ground+6*dpr);ctx.scale(1,sh/sw);const grd=ctx.createRadialGradient(0,0,0,0,0,sw);grd.addColorStop(0,'rgba(0,20,30,'+(.30*k)+')');grd.addColorStop(1,'rgba(0,20,30,0)');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(0,0,sw,0,Math.PI*2);ctx.fill();ctx.restore()}function drawPlayer(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.35,Math.min(.45,bird.vy/(16*dpr))));ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10*dpr;ctx.shadowOffsetX=6*dpr;ctx.shadowOffsetY=7*dpr;const s=bird.r*2.1;if(imageReady){ctx.beginPath();ctx.arc(0,0,s*.47,0,Math.PI*2);ctx.clip();ctx.drawImage(img,-s/2,-s/2,s,s);ctx.globalCompositeOperation='screen';let hi=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);hi.addColorStop(0,'rgba(255,246,180,.55)');hi.addColorStop(.45,'rgba(255,246,180,.10)');hi.addColorStop(1,'rgba(255,246,180,0)');ctx.fillStyle=hi;ctx.fillRect(-s/2,-s/2,s,s);ctx.globalCompositeOperation='multiply';let lo=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);lo.addColorStop(0,'rgba(255,255,255,0)');lo.addColorStop(.72,'rgba(12,22,40,.10)');lo.addColorStop(1,'rgba(12,22,40,.28)');ctx.fillStyle=lo;ctx.fillRect(-s/2,-s/2,s,s)}else{ctx.fillStyle='#ffd640';ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='700 '+12*dpr+'px Arial';ctx.textAlign='center';ctx.fillText('loading',0,4*dpr)}ctx.restore()}function dust(){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(255,252,220,.7)';for(const p of particles){p.y-=p.v;p.x+=p.v*.22;if(p.y<-12*dpr){p.y=H+10*dpr;p.x=Math.random()*W}ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}function vignette(){let g=ctx.createRadialGradient(W*.45,H*.38,Math.min(W,H)*.18,W*.45,H*.38,Math.max(W,H)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.72,'rgba(0,13,32,.10)');g.addColorStop(1,'rgba(0,0,0,.42)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}function txt(s,z,y){ctx.textAlign='center';ctx.font='800 '+z*dpr+'px Arial';ctx.lineWidth=5*dpr;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.fillStyle='#fff';ctx.strokeText(s,W/2,y);ctx.fillText(s,W/2,y)}function update(){if(playing&&!dead){frame++;bird.vy+=Math.max(.38*dpr,H*.00062);bird.y+=bird.vy;if(frame%96===0)addPipe();pipes.forEach(p=>p.x-=Math.max(2.6*dpr,W*.0068));pipes=pipes.filter(p=>p.x+p.w>-35*dpr);for(const p of pipes){if(!p.done&&p.x+p.w<bird.x){p.done=true;score++;beep(880,.06,'sine',.055)}if(hit(p))over()}if(bird.y-bird.r<0||bird.y+bird.r>H-ground)over()}}function loop(){requestAnimationFrame(loop);update();background();for(const p of pipes)drawPipeShadow(p);groundDraw();playerShadow();for(const p of pipes)pipe(p);drawPlayer();dust();vignette();txt(String(score),42,62*dpr);ctx.font='700 '+16*dpr+'px Arial';ctx.lineWidth=4*dpr;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.strokeText('最高分：'+best,W/2,92*dpr);ctx.fillText('最高分：'+best,W/2,92*dpr);if(!playing&&!dead){txt('Fly Shadow Light V8',29,H*.38);txt('点任意位置开始',20,H*.45)}if(dead){ctx.fillStyle='rgba(0,0,0,.36)';ctx.fillRect(W*.12,H*.34,W*.76,145*dpr);txt('游戏结束',30,H*.40);txt('点任意位置重开',19,H*.47)}}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();reset(false);loop();</script></body></html>
