<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fly Light V9</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,'Microsoft YaHei',sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.note{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:2;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}.badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;color:#fff;background:rgba(0,0,0,.34);padding:7px 10px;border-radius:999px;font:700 12px Arial,'Microsoft YaHei',sans-serif;pointer-events:none}</style></head><body><div class="note">V9 修正版：阴影 + 角色挡光</div><canvas id="game"></canvas><div class="badge">投影修正 / 光线遮挡 / 音效</div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),img=new Image();let ok=false;img.onload=()=>ok=true;fetch('./assets/player.b64.txt').then(r=>r.text()).then(t=>img.src='data:image/jpeg;base64,'+t.trim()).catch(()=>{});let W,H,dpr=1,ground,bird,pipes=[],score=0,best=+localStorage.getItem('flyLightV9Best')||0,playing=false,dead=false,frame=0,parts=[],ac=null;function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}function sfx(f=650,d=.07,type='triangle',v=.06){if(!ac)return;let t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;ground=Math.max(58*dpr,H*.095);if(!bird)reset(false);parts=Array.from({length:Math.min(42,Math.max(24,Math.round(W*H/52000)))},()=>({x:Math.random()*W,y:Math.random()*H,r:(.6+Math.random()*2.2)*dpr,v:(.12+Math.random()*.32)*dpr,a:.18+Math.random()*.42}))}function reset(st){bird={x:W*.28,y:H*.45,vy:0,r:Math.max(29*dpr,W*.073)};pipes=[];score=0;frame=0;dead=false;playing=!!st;if(st)addPipe()}function addPipe(){let gap=Math.max(192*dpr,H*.30),w=Math.max(62*dpr,W*.16),top=62*dpr+Math.random()*Math.max(1,H-ground-gap-155*dpr);pipes.push({x:W+45*dpr,w,top,gap,done:false})}function tap(e){e&&e.preventDefault();audio();if(!playing||dead){reset(true);sfx(520,.1,'sine',.05);return}bird.vy=-Math.max(8*dpr,H*.0125);sfx(680,.065,'triangle',.065)}c.addEventListener('pointerdown',tap,{passive:false});c.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});function hit(p){let r=bird.r*.62;return bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)}function over(){if(dead)return;dead=true;playing=false;best=Math.max(best,score);localStorage.setItem('flyLightV9Best',best);sfx(160,.16,'sawtooth',.045)}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55bfff');g.addColorStop(.5,'#dffaff');g.addColorStop(1,'#fff1c7');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.globalCompositeOperation='screen';let sun=x.createRadialGradient(W*.04,H*.04,0,W*.04,H*.04,W*.45);sun.addColorStop(0,'rgba(255,253,205,.95)');sun.addColorStop(.32,'rgba(255,226,120,.42)');sun.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sun;x.fillRect(0,0,W,H);ray(-.14,.10,.70,.18,.18);ray(-.20,.30,.78,.13,.11);ray(-.26,.48,.82,.09,.075);x.restore()}function ray(px,py,len,thick,a){x.save();x.translate(W*px,H*py);x.rotate(Math.PI*.20);let g=x.createLinearGradient(0,0,W*len,0);g.addColorStop(0,'rgba(255,255,220,'+a+')');g.addColorStop(.56,'rgba(255,244,190,'+a*.38+')');g.addColorStop(1,'rgba(255,244,190,0)');x.filter='blur('+Math.max(8*dpr,10)+'px)';x.fillStyle=g;x.fillRect(0,-H*thick/2,W*len,H*thick);x.restore();x.filter='none'}function softQuad(a,b,c1,d,col,blur=0){x.save();if(blur)x.filter='blur('+blur+'px)';x.fillStyle=col;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c1[0],c1[1]);x.lineTo(d[0],d[1]);x.closePath();x.fill();x.restore();x.filter='none'}function lightOcclusion(){x.save();x.globalCompositeOperation='source-over';for(const p of pipes){pipeOcc(p.x+p.w,p.top-8*dpr,p.x+p.w,p.top+8*dpr,.13);pipeOcc(p.x+p.w,p.top+p.gap-8*dpr,p.x+p.w,p.top+p.gap+8*dpr,.14)}let r=bird.r*.9,dx=150*dpr,dy=105*dpr;let g=x.createLinearGradient(bird.x,bird.y,bird.x+dx,bird.y+dy);g.addColorStop(0,'rgba(10,22,38,.26)');g.addColorStop(.55,'rgba(10,22,38,.09)');g.addColorStop(1,'rgba(10,22,38,0)');softQuad([bird.x+r*.35,bird.y-r*.25],[bird.x+r*.8,bird.y+r*.35],[bird.x+dx,bird.y+dy+r*.95],[bird.x+dx*.72,bird.y+dy-r*.65],g,5*dpr);x.restore()}function pipeOcc(x0,y0,x1,y1,a){let dx=145*dpr,dy=105*dpr,g=x.createLinearGradient(x0,y0,x0+dx,y0+dy);g.addColorStop(0,'rgba(10,22,38,'+a+')');g.addColorStop(1,'rgba(10,22,38,0)');softQuad([x0,y0],[x1,y1],[x1+dx,y1+dy],[x0+dx,y0+dy],g,5*dpr)}function castShadows(){for(const p of pipes){pipeCast(p.x,p.top,p.w,18*dpr,.12);pipeCast(p.x,p.top+p.gap,p.w,Math.min(H-ground-(p.top+p.gap),H*.25),.14)}let dist=Math.max(0,H-ground-bird.y),k=Math.max(.2,Math.min(1,1-dist/(H*.58)));x.save();x.translate(bird.x+dist*.07,H-ground+4*dpr);x.scale(1,.28);let g=x.createRadialGradient(0,0,0,0,0,bird.r*(1.5+k));g.addColorStop(0,'rgba(0,20,30,'+(.26*k)+')');g.addColorStop(1,'rgba(0,20,30,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,bird.r*(1.5+k),0,Math.PI*2);x.fill();x.restore()}function pipeCast(px,py,w,h,a){let dx=70*dpr,dy=48*dpr;x.save();x.filter='blur('+3*dpr+'px)';x.fillStyle='rgba(0,22,34,'+a+')';x.beginPath();x.moveTo(px+w,py);x.lineTo(px+w+dx,py+dy);x.lineTo(px+w+dx,py+h+dy);x.lineTo(px+w,py+h);x.closePath();x.fill();x.restore();x.filter='none'}function drawPipe(p){part(p.x,0,p.w,p.top,true);part(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),false)}function part(px,py,w,h,top){let g=x.createLinearGradient(px,py,px+w,py);g.addColorStop(0,'#2eb84d');g.addColorStop(.20,'#8af47f');g.addColorStop(.62,'#279c43');g.addColorStop(1,'#125d29');x.fillStyle=g;x.fillRect(px,py,w,h);x.fillStyle='rgba(255,255,235,.28)';x.fillRect(px+5*dpr,py,6*dpr,h);x.fillStyle='rgba(0,0,0,.20)';x.fillRect(px+w-10*dpr,py,10*dpr,h);x.fillStyle='#1e8538';if(top)x.fillRect(px-5*dpr,py+h-20*dpr,w+10*dpr,20*dpr);else x.fillRect(px-5*dpr,py,w+10*dpr,20*dpr)}function groundDraw(){x.fillStyle='rgba(0,0,0,.16)';x.fillRect(0,H-ground-8*dpr,W,10*dpr);x.fillStyle='#64b246';x.fillRect(0,H-ground,W,12*dpr);let g=x.createLinearGradient(0,H-ground,0,H);g.addColorStop(0,'#d8a647');g.addColorStop(1,'#996523');x.fillStyle=g;x.fillRect(0,H-ground+12*dpr,W,ground)}function player(){x.save();x.translate(bird.x,bird.y);x.rotate(Math.max(-.33,Math.min(.42,bird.vy/(16*dpr))));let s=bird.r*2.08;x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=7*dpr;x.shadowOffsetX=4*dpr;x.shadowOffsetY=5*dpr;if(ok){x.beginPath();x.arc(0,0,s*.47,0,Math.PI*2);x.clip();x.drawImage(img,-s/2,-s/2,s,s);x.globalCompositeOperation='screen';let hi=x.createLinearGradient(-s/2,-s/2,s/2,s/2);hi.addColorStop(0,'rgba(255,248,180,.58)');hi.addColorStop(.38,'rgba(255,248,180,.10)');hi.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=hi;x.fillRect(-s/2,-s/2,s,s);x.globalCompositeOperation='source-over';let sh=x.createLinearGradient(-s/2,-s/2,s/2,s/2);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.68,'rgba(15,20,40,.08)');sh.addColorStop(1,'rgba(15,20,40,.30)');x.fillStyle=sh;x.fillRect(-s/2,-s/2,s,s);x.strokeStyle='rgba(255,244,170,.38)';x.lineWidth=3*dpr;x.beginPath();x.arc(0,0,s*.46,Math.PI*1.05,Math.PI*1.55);x.stroke()}else{x.fillStyle='#ffd640';x.beginPath();x.arc(0,0,bird.r,0,Math.PI*2);x.fill()}x.restore()}function dust(){x.save();x.globalCompositeOperation='screen';for(const p of parts){p.y-=p.v;p.x+=p.v*.25;if(p.y<-8*dpr){p.y=H+8*dpr;p.x=Math.random()*W}x.globalAlpha=p.a;x.fillStyle='rgba(255,252,220,.72)';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()}x.restore();x.globalAlpha=1}function vignette(){let g=x.createRadialGradient(W*.45,H*.38,Math.min(W,H)*.2,W*.45,H*.38,Math.max(W,H)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.75,'rgba(0,12,30,.08)');g.addColorStop(1,'rgba(0,0,0,.38)');x.fillStyle=g;x.fillRect(0,0,W,H)}function text(t,z,y){x.textAlign='center';x.font='800 '+z*dpr+'px Arial';x.lineWidth=5*dpr;x.strokeStyle='rgba(0,0,0,.55)';x.fillStyle='#fff';x.strokeText(t,W/2,y);x.fillText(t,W/2,y)}function update(){if(!playing||dead)return;frame++;bird.vy+=Math.max(.38*dpr,H*.00062);bird.y+=bird.vy;if(frame%96===0)addPipe();pipes.forEach(p=>p.x-=Math.max(2.6*dpr,W*.0068));pipes=pipes.filter(p=>p.x+p.w>-35*dpr);for(const p of pipes){if(!p.done&&p.x+p.w<bird.x){p.done=true;score++;sfx(880,.055,'sine',.05)}if(hit(p))over()}if(bird.y-bird.r<0||bird.y+bird.r>H-ground)over()}function loop(){requestAnimationFrame(loop);update();bg();lightOcclusion();castShadows();groundDraw();for(const p of pipes)drawPipe(p);player();dust();vignette();text(String(score),42,62*dpr);x.font='700 '+16*dpr+'px Arial';x.lineWidth=4*dpr;x.strokeStyle='rgba(0,0,0,.45)';x.fillStyle='#fff';x.textAlign='center';x.strokeText('最高分：'+best,W/2,92*dpr);x.fillText('最高分：'+best,W/2,92*dpr);if(!playing&&!dead){text('Fly Light V9',31,H*.38);text('点任意位置开始',20,H*.45)}if(dead){x.fillStyle='rgba(0,0,0,.36)';x.fillRect(W*.12,H*.34,W*.76,145*dpr);text('游戏结束',30,H*.40);text('点任意位置重开',19,H*.47)}}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();reset(false);loop()})();</script></body></html>
