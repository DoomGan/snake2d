<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fly Light V11</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,'Microsoft YaHei',sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.note{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:2;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}.badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;color:#fff;background:rgba(0,0,0,.34);padding:7px 10px;border-radius:999px;font:700 12px Arial,'Microsoft YaHei',sans-serif;pointer-events:none}</style></head><body><div class="note">V11 修正版：角色投影稳定</div><canvas id="game"></canvas><div class="badge">修正角色阴影 / 移除错误长阴影</div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),img=new Image();let imgOK=false;img.onload=()=>imgOK=true;fetch('./assets/player.b64.txt').then(r=>r.text()).then(t=>img.src='data:image/jpeg;base64,'+t.trim()).catch(()=>{});let W,H,D=1,ground=0,gy=0,bird,pipes=[],score=0,best=+localStorage.getItem('flyLightV11Best')||0,playing=false,dead=false,frame=0,parts=[],ac=null,light={x:0,y:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){D=Math.min(devicePixelRatio||1,2);W=c.width=Math.floor(innerWidth*D);H=c.height=Math.floor(innerHeight*D);ground=Math.max(58*D,H*.095);gy=H-ground+7*D;light={x:-W*.14,y:-H*.14};if(!bird)reset(false);parts=Array.from({length:Math.min(34,Math.max(20,Math.round(W*H/70000)))},()=>({x:Math.random()*W,y:Math.random()*H,r:(.55+Math.random()*1.8)*D,v:(.10+Math.random()*.25)*D,a:.14+Math.random()*.32}))}function reset(start){bird={x:W*.28,y:H*.45,vy:0,r:Math.max(29*D,W*.073)};pipes=[];score=0;frame=0;dead=false;playing=!!start;if(start)addPipe()}function addPipe(){const gap=Math.max(196*D,H*.31),w=Math.max(62*D,W*.16),top=62*D+Math.random()*Math.max(1,H-ground-gap-158*D);pipes.push({x:W+45*D,w,top,gap,done:false})}function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}function sfx(f=650,d=.07,type='triangle',v=.055){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.18,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}function tap(e){e&&e.preventDefault();audio();if(!playing||dead){reset(true);sfx(520,.1,'sine',.045);return}bird.vy=-Math.max(8*D,H*.0125);sfx(690,.06,'triangle',.06)}c.addEventListener('pointerdown',tap,{passive:false});c.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});function hit(p){const r=bird.r*.62;return bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)}function over(){if(dead)return;dead=true;playing=false;best=Math.max(best,score);localStorage.setItem('flyLightV11Best',best);sfx(165,.16,'sawtooth',.04)}function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#52bfff');g.addColorStop(.52,'#dffaff');g.addColorStop(1,'#fff1c8');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.globalCompositeOperation='screen';const sun=x.createRadialGradient(W*.045,H*.045,0,W*.045,H*.045,W*.42);sun.addColorStop(0,'rgba(255,251,195,.95)');sun.addColorStop(.30,'rgba(255,226,125,.34)');sun.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sun;x.fillRect(0,0,W,H);ray(-.14,.08,.82,.16,.16);ray(-.22,.30,.88,.10,.09);ray(-.28,.48,.92,.07,.06);x.restore()}function ray(px,py,len,thick,a){x.save();x.translate(W*px,H*py);x.rotate(Math.PI*.20);const gr=x.createLinearGradient(0,0,W*len,0);gr.addColorStop(0,'rgba(255,255,224,'+a+')');gr.addColorStop(.56,'rgba(255,244,190,'+(a*.34)+')');gr.addColorStop(1,'rgba(255,244,190,0)');x.fillStyle=gr;x.fillRect(0,-H*thick/2,W*len,H*thick);x.restore()}function norm(vx,vy){const n=Math.hypot(vx,vy)||1;return{x:vx/n,y:vy/n}}function quad(a,b,c,d,fill){x.fillStyle=fill;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(c.x,c.y);x.lineTo(d.x,d.y);x.closePath();x.fill()}function airOcclusionCircle(cx,cy,r){const v=norm(cx-light.x,cy-light.y),p={x:-v.y,y:v.x},len=170*D,a1={x:cx+p.x*r,y:cy+p.y*r},a2={x:cx-p.x*r,y:cy-p.y*r},b2={x:a2.x+v.x*len,y:a2.y+v.y*len},b1={x:a1.x+v.x*len,y:a1.y+v.y*len};const gr=x.createLinearGradient(cx,cy,cx+v.x*len,cy+v.y*len);gr.addColorStop(0,'rgba(13,25,42,.18)');gr.addColorStop(.45,'rgba(13,25,42,.055)');gr.addColorStop(1,'rgba(13,25,42,0)');quad(a1,a2,b2,b1,gr)}function pipeAirOcclusion(p){const len=100*D,dx=72*D,dy=54*D;function one(y,h,a){if(h<=0)return;const y1=y,y2=y+Math.min(h,105*D),gr=x.createLinearGradient(p.x+p.w,y1,p.x+p.w+dx,y1+dy);gr.addColorStop(0,'rgba(13,25,42,'+a+')');gr.addColorStop(1,'rgba(13,25,42,0)');quad({x:p.x+p.w,y:y1},{x:p.x+p.w,y:y2},{x:p.x+p.w+len,y:y2+len*.72},{x:p.x+p.w+len,y:y1+len*.72},gr)}one(0,p.top,.055);one(p.top+p.gap,H-ground-(p.top+p.gap),.06)}function lightOcclusions(){for(const p of pipes)pipeAirOcclusion(p);airOcclusionCircle(bird.x,bird.y,bird.r*.86)}function groundDraw(){x.fillStyle='#62b146';x.fillRect(0,H-ground,W,12*D);const g=x.createLinearGradient(0,H-ground,0,H);g.addColorStop(0,'#d9a748');g.addColorStop(1,'#986522');x.fillStyle=g;x.fillRect(0,H-ground+12*D,W,ground)}function projectedPlayerShadow(){const denom=bird.y-light.y;if(denom<=1)return;let t=(gy-light.y)/denom;let sx=light.x+(bird.x-light.x)*t;sx=clamp(sx,-W*.12,W*1.12);const height=Math.max(0,gy-bird.y),hNorm=clamp(height/(H*.55),0,1),alpha=.28*(1-hNorm)+.075,sw=bird.r*(1.35+hNorm*1.95),sh=bird.r*(.24+hNorm*.12);x.save();x.translate(sx,gy);x.scale(1,sh/sw);const g=x.createRadialGradient(0,0,0,0,0,sw);g.addColorStop(0,'rgba(0,18,28,'+alpha+')');g.addColorStop(.55,'rgba(0,18,28,'+(alpha*.42)+')');g.addColorStop(1,'rgba(0,18,28,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,sw,0,Math.PI*2);x.fill();x.restore()}function pipeContactShadow(p){const y=H-ground+5*D;if(p.top+p.gap>=H-ground)return;x.save();x.translate(p.x+p.w*.5,y);x.scale(1,.20);const r=p.w*.80,g=x.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'rgba(0,16,25,.18)');g.addColorStop(1,'rgba(0,16,25,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fill();x.restore()}function groundShadows(){for(const p of pipes)pipeContactShadow(p);projectedPlayerShadow()}function drawPipe(p){part(p.x,0,p.w,p.top,true);part(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),false)}function part(px,py,w,h,top){if(h<=0)return;const g=x.createLinearGradient(px,py,px+w,py);g.addColorStop(0,'#2eb84d');g.addColorStop(.20,'#8af47f');g.addColorStop(.62,'#279c43');g.addColorStop(1,'#125d29');x.fillStyle=g;x.fillRect(px,py,w,h);x.fillStyle='rgba(255,255,235,.26)';x.fillRect(px+5*D,py,6*D,h);x.fillStyle='rgba(0,0,0,.20)';x.fillRect(px+w-9*D,py,9*D,h);x.fillStyle='#1e8538';if(top)x.fillRect(px-5*D,py+h-20*D,w+10*D,20*D);else x.fillRect(px-5*D,py,w+10*D,20*D)}function player(){x.save();x.translate(bird.x,bird.y);x.rotate(Math.max(-.32,Math.min(.40,bird.vy/(16*D))));const s=bird.r*2.08;x.shadowColor='rgba(0,0,0,.20)';x.shadowBlur=5*D;x.shadowOffsetX=2*D;x.shadowOffsetY=3*D;if(imgOK){x.beginPath();x.arc(0,0,s*.47,0,Math.PI*2);x.clip();x.drawImage(img,-s/2,-s/2,s,s);x.globalCompositeOperation='screen';let hi=x.createLinearGradient(-s/2,-s/2,s/2,s/2);hi.addColorStop(0,'rgba(255,248,182,.56)');hi.addColorStop(.34,'rgba(255,248,182,.10)');hi.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=hi;x.fillRect(-s/2,-s/2,s,s);x.globalCompositeOperation='source-over';let shade=x.createLinearGradient(-s/2,-s/2,s/2,s/2);shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(.72,'rgba(10,20,40,.08)');shade.addColorStop(1,'rgba(10,20,40,.24)');x.fillStyle=shade;x.fillRect(-s/2,-s/2,s,s);x.strokeStyle='rgba(255,243,168,.34)';x.lineWidth=2.5*D;x.beginPath();x.arc(0,0,s*.46,Math.PI*1.05,Math.PI*1.55);x.stroke()}else{x.fillStyle='#ffd640';x.beginPath();x.arc(0,0,bird.r,0,Math.PI*2);x.fill()}x.restore()}function dust(){x.save();x.globalCompositeOperation='screen';for(const p of parts){p.y-=p.v;p.x+=p.v*.22;if(p.y<-8*D){p.y=H+8*D;p.x=Math.random()*W}x.globalAlpha=p.a;x.fillStyle='rgba(255,252,220,.72)';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()}x.globalAlpha=1;x.restore()}function vignette(){const g=x.createRadialGradient(W*.45,H*.38,Math.min(W,H)*.22,W*.45,H*.38,Math.max(W,H)*.73);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.76,'rgba(0,12,30,.06)');g.addColorStop(1,'rgba(0,0,0,.32)');x.fillStyle=g;x.fillRect(0,0,W,H)}function text(t,z,y){x.textAlign='center';x.font='800 '+z*D+'px Arial';x.lineWidth=5*D;x.strokeStyle='rgba(0,0,0,.55)';x.fillStyle='#fff';x.strokeText(t,W/2,y);x.fillText(t,W/2,y)}function update(){if(!playing||dead)return;frame++;bird.vy+=Math.max(.38*D,H*.00062);bird.y+=bird.vy;if(frame%96===0)addPipe();pipes.forEach(p=>p.x-=Math.max(2.6*D,W*.0068));pipes=pipes.filter(p=>p.x+p.w>-35*D);for(const p of pipes){if(!p.done&&p.x+p.w<bird.x){p.done=true;score++;sfx(880,.055,'sine',.046)}if(hit(p))over()}if(bird.y-bird.r<0||bird.y+bird.r>H-ground)over()}function loop(){requestAnimationFrame(loop);update();bg();lightOcclusions();groundDraw();groundShadows();for(const p of pipes)drawPipe(p);player();dust();vignette();text(String(score),42,62*D);x.font='700 '+16*D+'px Arial';x.lineWidth=4*D;x.strokeStyle='rgba(0,0,0,.45)';x.fillStyle='#fff';x.textAlign='center';x.strokeText('最高分：'+best,W/2,92*D);x.fillText('最高分：'+best,W/2,92*D);if(!playing&&!dead){text('Fly Light V11',31,H*.38);text('点任意位置开始',20,H*.45)}if(dead){x.fillStyle='rgba(0,0,0,.36)';x.fillRect(W*.12,H*.34,W*.76,145*D);text('游戏结束',30,H*.40);text('点任意位置重开',19,H*.47)}}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();reset(false);loop()})();</script></body></html>
