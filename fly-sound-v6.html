<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fly Image Sound V6</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;overscroll-behavior:none}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#111}.tap{position:fixed;inset:0;z-index:5;touch-action:none}.badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;color:white;background:rgba(0,0,0,.35);padding:7px 10px;border-radius:999px;font:700 12px Arial,"Microsoft YaHei",sans-serif;pointer-events:none;text-shadow:0 1px 3px #000}</style></head><body><iframe id="game" src="./fly-image-v5.html"></iframe><div id="tap" class="tap"></div><div class="badge">V6 音效版</div><script>const frame=document.getElementById('game'),tapLayer=document.getElementById('tap');let audioCtx=null;function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function beep(freq=620,dur=.075,type='triangle',vol=.08){if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}function forwardTap(e){e.preventDefault();ensureAudio();beep();try{const w=frame.contentWindow,d=w.document,el=d.getElementById('game')||d.querySelector('canvas')||d.body;const ev=window.PointerEvent?new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,clientX:e.clientX||innerWidth/2,clientY:e.clientY||innerHeight/2,pointerId:1,pointerType:'touch',isPrimary:true}):new w.MouseEvent('pointerdown',{bubbles:true,cancelable:true,clientX:e.clientX||innerWidth/2,clientY:e.clientY||innerHeight/2});el.dispatchEvent(ev)}catch(err){console.log(err)}}tapLayer.addEventListener('pointerdown',forwardTap,{passive:false});tapLayer.addEventListener('touchstart',function(e){if(!window.PointerEvent)forwardTap(e.changedTouches[0]||e)},{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});</script></body></html>
