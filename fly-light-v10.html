<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>Fly Light V10</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,Microsoft YaHei,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.note{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:2;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}.badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;color:#fff;background:rgba(0,0,0,.34);padding:7px 10px;border-radius:999px;font:700 12px Arial,Microsoft YaHei,sans-serif;pointer-events:none}</style></head><body><div class='note'>V10 分层光照版：修正阴影与角色挡光</div><canvas id='game'></canvas><div class='badge'>Layered light / shadow</div><script>(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),img=new Image();let imgOK=false;img.onload=()=>imgOK=true;fetch('./assets/player.b64.txt').then(r=>r.text()).then(t=>img.src='data:image/jpeg;base64,'+t.trim()).catch(()=>{});const light=document.createElement('canvas'),lctx=light.getContext('2d'),shadow=document.createElement('canvas'),sctx=shadow.getContext('2d');let W=0,H=0,D=1,ground=0,bird,pipes=[],score=0,best=+localStorage.getItem('flyLightV10Best')||0,playing=false,dead=false,frame=0,parts=[],ac=null,lightPos={x:0,y:0};function resize(){D=Math.min(devicePixelRatio||1,2);W=c.width=light.width=shadow.width=Math.floor(innerWidth*D);H=c.height=light.height=shadow.height=Math.floor(innerHeight*D);ground=Math.max(58*D,H*.095);lightPos={x:-W*.12,y:-H*.10};if(!bird)reset(false);makeDust()}function makeDust(){parts=Array.from({length:Math.min(38,Math.max(22,Math.round(W*H/62000)))},()=>({x:Math.random()*W,y:Math.random()*H,r:(.55+Math.random()*1.9)*D,v:(.10+Math.random()*.28)*D,a:.16+Math.random()*.35}))}function reset(start){bird={x:W*.28,y:H*.45,vy:0,r:Math.max(29*D,W*.073)};pipes=[];score=0;frame=0;dead=false;playing=!!start;if(start)addPipe()}function addPipe(){const gap=Math.max(194*D,H*.305),w=Math.max(62*D,W*.16),top=62*D+Math.random()*Math.max(1,H-ground-gap-155*D);pipes.push({x:W+45*D,w,top,gap,done:false})}function audio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}function sfx(f=650,d=.07,type='triangle',v=.055){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.18,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}function tap(e){e&&e.preventDefault();audio();if(!playing||dead){reset(true);sfx(520,.1,'sine',.045);return}bird.vy=-Math.max(8*D,H*.0125);sfx(690,.06,'triangle',.06)}c.addEventListener('pointerdown',tap,{passive:false});c.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});function hit(p){const r=bird.r*.62;return bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)}function over(){if(dead)return;dead=true;playing=false;best=Math.max(best,score);localStorage.setItem('flyLightV10Best',best);sfx(165,.16,'sawtooth',.04)}function norm(vx,vy){const n=Math.hypot(vx,vy)||1;return{x:vx/n,y:vy/n}}function project(pt,len){const v=norm(pt.x-lightPos.x,pt.y-lightPos.y);return{x:pt.x+v.x*len,y:pt.y+v.y*len}}function quad(g,a,b,c,d){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.lineTo(c.x,c.y);g.lineTo(d.x,d.y);g.closePath();g.fill()}function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#52bfff');g.addColorStop(.52,'#dffaff');g.addColorStop(1,'#fff1c8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sun=ctx.createRadialGradient(W*.045,H*.045,0,W*.045,H*.045,W*.42);sun.addColorStop(0,'rgba(255,251,195,.95)');sun.addColorStop(.30,'rgba(255,226,125,.34)');sun.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=sun;ctx.fillRect(0,0,W,H)}function groundDraw(){ctx.fillStyle='#62b146';ctx.fillRect(0,H-ground,W,12*D);const g=ctx.createLinearGradient(0,H-ground,0,H);g.addColorStop(0,'#d9a748');g.addColorStop(1,'#986522');ctx.fillStyle=g;ctx.fillRect(0,H-ground+12*D,W,ground)}function drawLightLayer(){lctx.clearRect(0,0,W,H);lctx.globalCompositeOperation='source-over';lctx.save();lctx.globalCompositeOperation='screen';drawRay(lctx,-.14,.08,.82,.16,.18);drawRay(lctx,-.22,.29,.88,.11,.10);drawRay(lctx,-.28,.47,.92,.075,.07);lctx.restore();lctx.globalCompositeOperation='destination-out';for(const p of pipes){cutRectLight(p.x,0,p.w,p.top,.38,155*D);cutRectLight(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),.34,145*D)}cutCircleLight(bird.x,bird.y,bird.r*.92,.46,160*D);lctx.globalCompositeOperation='source-over'}function drawRay(g,px,py,len,thick,a){g.save();g.translate(W*px,H*py);g.rotate(Math.PI*.20);const gr=g.createLinearGradient(0,0,W*len,0);gr.addColorStop(0,'rgba(255,255,224,'+a+')');gr.addColorStop(.56,'rgba(255,244,190,'+(a*.34)+')');gr.addColorStop(1,'rgba(255,244,190,0)');g.fillStyle=gr;g.fillRect(0,-H*thick/2,W*len,H*thick);g.restore()}function cutRectLight(x,y,w,h,a,len){if(h<=0)return;const maxH=Math.min(h,H*.38),topY=y,botY=y+maxH;const a1={x:x+w,y:topY},a2={x:x+w,y:botY},b2=project(a2,len),b1=project(a1,len);const gr=lctx.createLinearGradient(a1.x,a1.y,b1.x,b1.y);gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(.55,'rgba(0,0,0,'+(a*.38)+')');gr.addColorStop(1,'rgba(0,0,0,0)');lctx.fillStyle=gr;quad(lctx,a1,a2,b2,b1)}function cutCircleLight(cx,cy,r,a,len){const v=norm(cx-lightPos.x,cy-lightPos.y),p={x:-v.y,y:v.x};const a1={x:cx+p.x*r,y:cy+p.y*r},a2={x:cx-p.x*r,y:cy-p.y*r},b2={x:a2.x+v.x*len,y:a2.y+v.y*len},b1={x:a1.x+v.x*len,y:a1.y+v.y*len};const gr=lctx.createLinearGradient(cx,cy,cx+v.x*len,cy+v.y*len);gr.addColorStop(0,'rgba(0,0,0,'+a+')');gr.addColorStop(.45,'rgba(0,0,0,'+(a*.25)+')');gr.addColorStop(1,'rgba(0,0,0,0)');lctx.fillStyle=gr;quad(lctx,a1,a2,b2,b1);lctx.fillStyle='rgba(0,0,0,.18)';lctx.beginPath();lctx.arc(cx,cy,r*.95,0,Math.PI*2);lctx.fill()}function drawShadowLayer(){sctx.clearRect(0,0,W,H);sctx.globalCompositeOperation='source-over';for(const p of pipes){rectShadow(p.x,0,p.w,p.top,.09,95*D);rectShadow(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),.08,80*D)}groundShadow();sctx.globalCompositeOperation='source-over'}function rectShadow(x,y,w,h,a,len){if(h<=0)return;const maxH=Math.min(h,H*.32),top=y,bot=y+maxH;const p1={x:x+w,y:top},p2={x:x+w,y:bot},q2=project(p2,len),q1=project(p1,len);const gr=sctx.createLinearGradient(p1.x,p1.y,q1.x,q1.y);gr.addColorStop(0,'rgba(0,20,32,'+a+')');gr.addColorStop(.72,'rgba(0,20,32,'+(a*.30)+')');gr.addColorStop(1,'rgba(0,20,32,0)');sctx.fillStyle=gr;quad(sctx,p1,p2,q2,q1)}function groundShadow(){const dist=Math.max(0,H-ground-bird.y),k=Math.max(.12,Math.min(1,1-dist/(H*.58)));sctx.save();sctx.translate(bird.x+dist*.055,H-ground+5*D);sctx.scale(1,.28);const r=bird.r*(1.35+k*.95);const gr=sctx.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,'rgba(0,20,32,'+(.23*k)+')');gr.addColorStop(1,'rgba(0,20,32,0)');sctx.fillStyle=gr;sctx.beginPath();sctx.arc(0,0,r,0,Math.PI*2);sctx.fill();sctx.restore()}function part(x,y,w,h,top){if(h<=0)return;const g=ctx.createLinearGradient(x,y,x+w,y);g.addColorStop(0,'#2eb84d');g.addColorStop(.20,'#8af47f');g.addColorStop(.62,'#279c43');g.addColorStop(1,'#125d29');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,235,.25)';ctx.fillRect(x+5*D,y,6*D,h);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x+w-9*D,y,9*D,h);ctx.fillStyle='#1e8538';if(top)ctx.fillRect(x-5*D,y+h-20*D,w+10*D,20*D);else ctx.fillRect(x-5*D,y,w+10*D,20*D)}function drawPipe(p){part(p.x,0,p.w,p.top,true);part(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap),false)}function player(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.32,Math.min(.40,bird.vy/(16*D))));const s=bird.r*2.08;ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=6*D;ctx.shadowOffsetX=3*D;ctx.shadowOffsetY=4*D;if(imgOK){ctx.beginPath();ctx.arc(0,0,s*.47,0,Math.PI*2);ctx.clip();ctx.drawImage(img,-s/2,-s/2,s,s);ctx.globalCompositeOperation='screen';let hi=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);hi.addColorStop(0,'rgba(255,248,182,.55)');hi.addColorStop(.34,'rgba(255,248,182,.10)');hi.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=hi;ctx.fillRect(-s/2,-s/2,s,s);ctx.globalCompositeOperation='source-over';let shade=ctx.createLinearGradient(-s/2,-s/2,s/2,s/2);shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(.72,'rgba(10,20,40,.08)');shade.addColorStop(1,'rgba(10,20,40,.24)');ctx.fillStyle=shade;ctx.fillRect(-s/2,-s/2,s,s);ctx.strokeStyle='rgba(255,243,168,.34)';ctx.lineWidth=2.5*D;ctx.beginPath();ctx.arc(0,0,s*.46,Math.PI*1.05,Math.PI*1.55);ctx.stroke()}else{ctx.fillStyle='#ffd640';ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill()}ctx.restore()}function dust(){ctx.save();ctx.globalCompositeOperation='screen';for(const p of parts){p.y-=p.v;p.x+=p.v*.22;if(p.y<-8*D){p.y=H+8*D;p.x=Math.random()*W}ctx.globalAlpha=p.a;ctx.fillStyle='rgba(255,252,220,.72)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}function vignette(){const g=ctx.createRadialGradient(W*.45,H*.38,Math.min(W,H)*.22,W*.45,H*.38,Math.max(W,H)*.73);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.76,'rgba(0,12,30,.07)');g.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}function text(t,z,y){ctx.textAlign='center';ctx.font='800 '+z*D+'px Arial';ctx.lineWidth=5*D;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.fillStyle='#fff';ctx.strokeText(t,W/2,y);ctx.fillText(t,W/2,y)}function update(){if(!playing||dead)return;frame++;bird.vy+=Math.max(.38*D,H*.00062);bird.y+=bird.vy;if(frame%96===0)addPipe();pipes.forEach(p=>p.x-=Math.max(2.6*D,W*.0068));pipes=pipes.filter(p=>p.x+p.w>-35*D);for(const p of pipes){if(!p.done&&p.x+p.w<bird.x){p.done=true;score++;sfx(880,.055,'sine',.046)}if(hit(p))over()}if(bird.y-bird.r<0||bird.y+bird.r>H-ground)over()}function loop(){requestAnimationFrame(loop);update();bg();groundDraw();drawShadowLayer();ctx.save();ctx.globalAlpha=.92;ctx.drawImage(shadow,0,0);ctx.restore();drawLightLayer();ctx.save();ctx.globalCompositeOperation='screen';ctx.drawImage(light,0,0);ctx.restore();for(const p of pipes)drawPipe(p);player();dust();vignette();text(String(score),42,62*D);ctx.font='700 '+16*D+'px Arial';ctx.lineWidth=4*D;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.strokeText('最高分：'+best,W/2,92*D);ctx.fillText('最高分：'+best,W/2,92*D);if(!playing&&!dead){text('Fly Light V10',31,H*.38);text('点任意位置开始',20,H*.45)}if(dead){ctx.fillStyle='rgba(0,0,0,.36)';ctx.fillRect(W*.12,H*.34,W*.76,145*D);text('游戏结束',30,H*.40);text('点任意位置重开',19,H*.47)}}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();reset(false);loop()})();</script></body></html>
