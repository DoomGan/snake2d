ird.y);ctx.rotate(Math.max(-.35,Math.min(.45,bird.vy/(16*dpr))));ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=8*dpr;if(imageReady){const s=bird.r*2.05;ctx.beginPath();ctx.arc(0,0,s*.47,0,Math.PI*2);ctx.clip();ctx.drawImage(img,-s/2,-s/2,s,s)}else{ctx.fillStyle='#ffd640';ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='700 '+12*dpr+'px Arial';ctx.textAlign='center';ctx.fillText('loading',0,4*dpr)}ctx.restore()}function pipe(p){ctx.fillStyle='#29a745';ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap));ctx.fillStyle='#1f8438';ctx.fillRect(p.x-5*dpr,p.top-20*dpr,p.w+10*dpr,20*dpr);ctx.fillRect(p.x-5*dpr,p.top+p.gap,p.w+10*dpr,20*dpr)}function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);if(playing&&!dead){frame++;bird.vy+=Math.max(.38*dpr,H*.00062);bird.y+=bird.vy;if(frame%96===0)addPipe();pipes.forEach(p=>p.x-=Math.max(2.6*dpr,W*.0068));pipes=pipes.filter(p=>p.x+p.w>-30*dpr);for(const p of pipes){if(!p.done&&p.x+p.w<bird.x){p.done=true;score++}if(hit(p))over()}if(bird.y-bird.r<0||bird.y+bird.r>H-ground)over()}pipes.forEach(pipe);ctx.fillStyle='#64b246';ctx.fillRect(0,H-ground,W,12*dpr);ctx.fillStyle='#cc9639';ctx.fillRect(0,H-ground+12*dpr,W,ground);drawPlayer();txt(String(score),42,62*dpr);ctx.font='700 '+16*dpr+'px Arial';ctx.lineWidth=4*dpr;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.strokeText('最高分：'+best,W/2,92*dpr);ctx.fillText('最高分：'+best,W/2,92*dpr);if(!playing&&!dead){txt('Fly Image V5',30,H*.38);txt('点任意位置开始',20,H*.45)}if(dead){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(W*.12,H*.34,W*.76,145*dpr);txt('游戏结束',30,H*.40);txt('点任意位置重开',19,H*.47)}}addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();reset(false);loop();</script></body></html>
