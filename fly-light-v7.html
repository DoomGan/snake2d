<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fly Light V7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061421;touch-action:none;overscroll-behavior:none}iframe{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#111;filter:saturate(1.15) contrast(1.04) brightness(1.02)}#fx{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}.sun{position:absolute;left:-8vw;top:-8vh;width:42vw;height:42vw;border-radius:50%;background:radial-gradient(circle,rgba(255,245,178,.95) 0%,rgba(255,225,126,.45) 32%,rgba(255,225,126,.08) 65%,rgba(255,225,126,0) 76%);filter:blur(6px);mix-blend-mode:screen;animation:pulse 4.5s ease-in-out infinite}.ray{position:absolute;left:-18vw;top:-20vh;width:120vw;height:42vh;transform-origin:left top;background:linear-gradient(100deg,rgba(255,252,207,.38),rgba(255,244,177,.13) 42%,rgba(255,244,177,0) 75%);filter:blur(12px);mix-blend-mode:screen;opacity:.72;animation:ray 7s ease-in-out infinite}.r1{transform:rotate(18deg)}.r2{top:2vh;transform:rotate(32deg);opacity:.45;animation-delay:-2.1s}.r3{top:24vh;transform:rotate(46deg);opacity:.30;animation-delay:-4.4s}.vignette{position:absolute;inset:-10%;background:radial-gradient(ellipse at 45% 40%,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 45%,rgba(0,12,30,.26) 82%,rgba(0,0,0,.55) 100%)}.warm{position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,232,144,.20),rgba(94,193,255,.05) 38%,rgba(0,0,0,0) 70%);mix-blend-mode:soft-light}.particle{position:absolute;border-radius:999px;background:rgba(255,255,220,.72);box-shadow:0 0 12px rgba(255,245,180,.8);filter:blur(.3px);animation:float linear infinite;opacity:.7}.tap{position:fixed;inset:0;z-index:6;touch-action:none}.badge{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;color:white;background:rgba(0,0,0,.34);padding:7px 10px;border-radius:999px;font:700 12px Arial,"Microsoft YaHei",sans-serif;pointer-events:none;text-shadow:0 1px 3px #000}@keyframes pulse{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.08);opacity:1}}@keyframes ray{0%,100%{filter:blur(12px);opacity:.52}50%{filter:blur(18px);opacity:.86}}@keyframes float{from{transform:translate3d(0,105vh,0)}to{transform:translate3d(18vw,-15vh,0)}}</style></head><body><iframe id="game" src="./fly-image-v5.html"></iframe><div id="fx"><div class="sun"></div><div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div><div class="warm"></div><div id="particles"></div><div class="vignette"></div></div><div id="tap" class="tap"></div><div class="badge">V7 光影音效版</div><script>const parts=document.getElementById('particles');for(let i=0;i<42;i++){const p=document.createElement('i');p.className='particle';const s=1.2+Math.random()*3.4;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(8+Math.random()*14)+'s';p.style.animationDelay=(-Math.random()*18)+'s';p.style.opacity=(.28+Math.random()*.48).toFixed(2);parts.appendChild(p)}const frame=document.getElementById('game'),tapLayer=document.getElementById('tap');let audioCtx=null;function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function beep(freq=650,dur=.075,type='triangle',vol=.075){if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.35,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}function forwardTap(e){e.preventDefault();ensureAudio();beep();try{const w=frame.contentWindow,d=w.document,el=d.getElementById('game')||d.querySelector('canvas')||d.body;const cx=e.clientX||innerWidth/2,cy=e.clientY||innerHeight/2;const ev=window.PointerEvent?new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true,clientX:cx,clientY:cy,pointerId:1,pointerType:'touch',isPrimary:true}):new w.MouseEvent('pointerdown',{bubbles:true,cancelable:true,clientX:cx,clientY:cy});el.dispatchEvent(ev)}catch(err){console.log(err)}}tapLayer.addEventListener('pointerdown',forwardTap,{passive:false});tapLayer.addEventListener('touchstart',function(e){if(!window.PointerEvent)forwardTap(e.changedTouches[0]||e)},{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});</script></body></html>
