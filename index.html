<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>实时手势识别</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#0b0b0f; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; overflow:hidden; }
    #app { position:relative; width:100vw; height:100dvh; overflow:hidden; }
    video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
    #panel { position:absolute; top:env(safe-area-inset-top,0); left:0; right:0; z-index:3; padding:14px; pointer-events:none; }
    #card { display:inline-block; max-width:calc(100vw - 28px); padding:12px 14px; border-radius:16px; background:rgba(0,0,0,.56); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); white-space:pre-line; line-height:1.45; font-size:16px; }
    #startBtn { position:absolute; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:4; border:0; border-radius:999px; padding:14px 24px; font-size:18px; font-weight:700; color:#111; background:#fff; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    #hint { position:absolute; left:14px; right:14px; bottom:calc(90px + env(safe-area-inset-bottom,0px)); z-index:3; color:rgba(255,255,255,.82); font-size:13px; text-align:center; text-shadow:0 1px 8px #000; }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="panel"><div id="card">点击“开始识别”，允许摄像头权限。</div></div>
    <div id="hint">支持 iPhone Safari / Android Chrome。需要 HTTPS。</div>
    <button id="startBtn">开始识别</button>
  </div>

  <script type="module">
    import { GestureRecognizer, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const card = document.getElementById("card");
    const startBtn = document.getElementById("startBtn");
    const hint = document.getElementById("hint");

    let recognizer = null;
    let drawingUtils = null;
    let running = false;
    let lastVideoTime = -1;

    const gestureCN = {
      None: "未识别",
      Closed_Fist: "握拳",
      Open_Palm: "张开手掌",
      Pointing_Up: "食指向上",
      Thumb_Down: "拇指向下",
      Thumb_Up: "拇指向上",
      Victory: "胜利手势",
      ILoveYou: "我爱你手势"
    };

    function setStatus(text) { card.textContent = text; }

    async function loadModel() {
      setStatus("正在加载识别模型...\n首次打开可能需要几秒。");
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
      recognizer = await GestureRecognizer.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
      drawingUtils = new DrawingUtils(ctx);
    }

    async function startCamera() {
      setStatus("正在启动摄像头...");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await new Promise(resolve => { video.onloadedmetadata = resolve; });
      await video.play();
      resizeCanvas();
    }

    function resizeCanvas() {
      const w = video.videoWidth || window.innerWidth;
      const h = video.videoHeight || window.innerHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function drawResult(result) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!result.landmarks || result.landmarks.length === 0) {
        setStatus("未检测到手\n请把手放到摄像头前");
        return;
      }
      for (const landmarks of result.landmarks) {
        drawingUtils.drawConnectors(landmarks, GestureRecognizer.HAND_CONNECTIONS, { lineWidth: 4 });
        drawingUtils.drawLandmarks(landmarks, { radius: 4 });
      }
      const lines = [`检测到 ${result.landmarks.length} 只手`];
      if (result.gestures && result.gestures.length) {
        result.gestures.forEach((g, i) => {
          if (!g || !g[0]) return;
          const name = g[0].categoryName;
          const score = Math.round(g[0].score * 100);
          lines.push(`手 ${i + 1}：${gestureCN[name] || name} / ${score}%`);
        });
      } else {
        lines.push("手势：未识别出明确动作");
      }
      setStatus(lines.join("\n"));
    }

    function loop() {
      if (!running) return;
      resizeCanvas();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        drawResult(recognizer.recognizeForVideo(video, performance.now()));
      }
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", async () => {
      try {
        startBtn.disabled = true;
        startBtn.textContent = "启动中...";
        if (!recognizer) await loadModel();
        await startCamera();
        running = true;
        startBtn.style.display = "none";
        hint.style.display = "none";
        setStatus("识别中...\n请把手放到摄像头前");
        loop();
      } catch (err) {
        console.error(err);
        setStatus("启动失败\n请确认：\n1. 使用 HTTPS 打开页面\n2. Safari 已允许摄像头\n3. 网络能加载 MediaPipe 模型");
        startBtn.disabled = false;
        startBtn.textContent = "重新开始";
      }
    });

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 300));
  </script>
</body>
</html>
