<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fly Bird Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,"Microsoft YaHei",sans-serif}#game{display:block;width:100vw;height:100dvh;background:linear-gradient(#70cfff,#ecffff);touch-action:none}.note{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));text-align:center;color:white;text-shadow:0 2px 5px #000;font-weight:700;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div class="note">点屏幕开始 / 点击让小鸟上升</div>
<canvas id="game"></canvas>
<script>
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,dpr,bird,pipes,score,best=Number(localStorage.getItem('flyBirdBest')||0),playing=false,dead=false,frame=0,ground=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=canvas.width=Math.floor(window.innerWidth*dpr);H=canvas.height=Math.floor(window.innerHeight*dpr);ground=Math.max(54*dpr,H*.09);if(!bird)reset(false)}
function reset(start){bird={x:W*.28,y:H*.45,vy:0,r:Math.max(16*dpr,W*.042)};pipes=[];score=0;frame=0;dead=false;playing=!!start;if(start)addPipe()}
function addPipe(){const gap=Math.max(145*dpr,H*.23),w=Math.max(58*dpr,W*.16);const max=H-ground-gap-80*dpr;const top=55*dpr+Math.random()*Math.max(1,max-55*dpr);pipes.push({x:W+40*dpr,w,top,gap,done:false})}
function tap(e){if(e)e.preventDefault();if(!playing||dead){reset(true);return}bird.vy=-Math.max(7.5*dpr,H*.012)}
canvas.addEventListener('touchstart',tap,{passive:false});canvas.addEventListener('pointerdown',tap,{passive:false});document.body.addEventListener('touchstart',tap,{passive:false});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());
function hit(p){const r=bird.r*.82;return bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap)}
function over(){dead=true;playing=false;best=Math.max(best,score);localStorage.setItem('flyBirdBest',best)}
function txt(s,size,y){ctx.textAlign='center';ctx.font='800 '+size*dpr+'px Arial';ctx.lineWidth=5*dpr;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.fillStyle='#fff';ctx.strokeText(s,W/2,y);ctx.fillText(s,W/2,y)}
function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.55,Math.min(.75,bird.vy/(11*dpr))));ctx.fillStyle='#ffd640';ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9d2e';ctx.beginPath();ctx.ellipse(-bird.r*.35,bird.r*.25,bird.r*.7,bird.r*.43,-.45,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bird.r*.42,-bird.r*.38,bird.r*.28,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(bird.r*.52,-bird.r*.38,bird.r*.11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7030';ctx.beginPath();ctx.moveTo(bird.r*.95,-bird.r*.1);ctx.lineTo(bird.r*1.75,bird.r*.28);ctx.lineTo(bird.r*.95,bird.r*.62);ctx.closePath();ctx.fill();ctx.restore()}
function drawPipe(p){ctx.fillStyle='#29a745';ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,H-ground-(p.top+p.gap));ctx.fillStyle='#1f8438';ctx.fillRect(p.x-5*dpr,p.top-20*dpr,p.w+10*dpr,20*dpr);ctx.fillRect(p.x-5*dpr,p.top+p.gap,p.w+10*dpr,20*dpr)}
function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);if(playing&&!dead){frame++;bird.vy+=Math.max(.38*dpr,H*.00062);bird.y+=bird.vy;if(frame%92===0)addPipe();pipes.forEach(p=>p.x-=Math.max(2.6*dpr,W*.0068));pipes=pipes.filter(p=>p.x+p.w>-30*dpr);for(const p of pipes){if(!p.done&&p.x+p.w<bird.x){p.done=true;score++}if(hit(p))over()}if(bird.y-bird.r<0||bird.y+bird.r>H-ground)over()}for(const p of pipes)drawPipe(p);ctx.fillStyle='#64b246';ctx.fillRect(0,H-ground,W,12*dpr);ctx.fillStyle='#cc9639';ctx.fillRect(0,H-ground+12*dpr,W,ground);drawBird();txt(String(score),42,62*dpr);ctx.font='700 '+16*dpr+'px Arial';ctx.lineWidth=4*dpr;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.strokeText('最高分：'+best,W/2,92*dpr);ctx.fillText('最高分：'+best,W/2,92*dpr);if(!playing&&!dead){txt('Fly Bird',34,H*.38);txt('点任意位置开始',20,H*.45)}if(dead){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(W*.12,H*.34,W*.76,145*dpr);txt('游戏结束',30,H*.40);txt('点任意位置重开',19,H*.47)}}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));resize();reset(false);loop();
})();
</script>
</body>
</html>
